<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/styles.css">
    <script defer src="js/script.js"></script>
</head>

<body>
    <div class="stepper">
        <label class="stepper__field">
            <input type="text" value="1" maxlength="3" class="stepper__input">
            <span class="stepper__text">шт</span>
        </label>
        <div class="stepper__btns">
            <button class="stepper__btn stepper__btn--up" aria-label="Увеличить количество">+</button>
            <button class="stepper__btn stepper__btn--down stepper__btn--disabled" aria-label="Уменьшить количество">-</button>
        </div>
    </div>
</body>

</html>
